name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: reeva-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      REEVA_TEST_PG_HOST: 127.0.0.1
      REEVA_TEST_PG_PORT: 5432
      REEVA_TEST_PG_USER: postgres
      REEVA_TEST_PG_PASSWORD: reeva-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:dependencies
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm verify:migration-upgrade
      - run: pnpm verify:legacy-import
      - run: pnpm verify:storage-config
      - run: pnpm build
      - run: pnpm verify:production-smoke
      - run: REEVA_SMOKE_SESSION_DRIVER=database pnpm verify:production-smoke
      - run: pnpm verify:docker-compose
