services:
  app:
    build:
      context: .
      target: production

    ports:
      - '${PORT:-8888}:${PORT:-8888}'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-8888}
      HOST: 0.0.0.0
      DB_CONNECTION: ${DB_CONNECTION:-sqlite}
      DB_HOST: ${MYSQLHOST:-${DB_HOST:-}}
      DB_PORT: ${MYSQLPORT:-${DB_PORT:-3306}}
      DB_USER: ${MYSQLUSER:-${DB_USER:-root}}
      DB_PASSWORD: ${MYSQLPASSWORD:-${DB_PASSWORD:-}}
      DB_DATABASE: ${MYSQLDATABASE:-${DB_DATABASE:-reeva}}
      SQLITE_DATABASE_PATH: ${SQLITE_DATABASE_PATH:-/app/storage/reeva.sqlite3}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-database}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-auto}
      S3_MAX_ATTEMPTS: ${S3_MAX_ATTEMPTS:-3}
      S3_CONNECTION_TIMEOUT_MS: ${S3_CONNECTION_TIMEOUT_MS:-10000}
      S3_SOCKET_TIMEOUT_MS: ${S3_SOCKET_TIMEOUT_MS:-120000}
      S3_DOWNLOAD_URL_TTL_SECONDS: ${S3_DOWNLOAD_URL_TTL_SECONDS:-3600}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:${PORT:-8888}}
      APP_GIT_SHA: ${APP_GIT_SHA:-}
      SESSION_DRIVER: ${SESSION_DRIVER:-cookie}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Reeva}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-reeva@localhost}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-1gb}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - reeva_storage:/app/storage
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/login').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  reeva_storage:
