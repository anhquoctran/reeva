services:
  app:
    build:
      context: .
      target: production

    ports:
      - '3333:3333'
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3333}
      HOST: ${HOST:-0.0.0.0}
      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${MYSQLHOST:-${DB_HOST}}
      DB_PORT: ${MYSQLPORT:-${DB_PORT}}
      DB_USER: ${MYSQLUSER:-${DB_USER}}
      DB_PASSWORD: ${MYSQLPASSWORD:-${DB_PASSWORD}}
      DB_DATABASE: ${MYSQLDATABASE:-${DB_DATABASE}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      SESSION_DRIVER: ${SESSION_DRIVER:-cookie}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Reeva}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-sandbox.smtp.mailtrap.io}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    command: node build/bin/server.js
