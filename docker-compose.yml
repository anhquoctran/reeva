services:
  app:
    image: ${COMPOSE_PROJECT_NAME:-reeva}-app
    depends_on:
      postgres:
        condition: service_healthy
      database-init:
        condition: service_completed_successfully
      signer-secrets:
        condition: service_completed_successfully
    build:
      context: .
      target: production

    ports:
      # HOST_PORT can differ for reverse proxies or isolated smoke tests; the
      # internal app port remains PORT (8888 by default).
      - '${HOST_PORT:-${PORT:-8888}}:${PORT:-8888}'
    environment:
      NODE_ENV: production
      PORT: ${PORT:-8888}
      HOST: 0.0.0.0
      DB_CONNECTION: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-reeva}
      DB_DATABASE: ${POSTGRES_DB:-reeva}
      DB_PASSWORD_FILE: /app/secrets/db_password
      DB_STARTUP_TIMEOUT_SECONDS: ${DB_STARTUP_TIMEOUT_SECONDS:-30}
      DB_SSL: 'false'
      # Temporary compatibility inputs for the one-time migration of old
      # environment-backed storage records. New installs leave these empty.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SESSION_TOKEN: ${S3_SESSION_TOKEN:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-auto}
      S3_MAX_ATTEMPTS: ${S3_MAX_ATTEMPTS:-3}
      S3_CONNECTION_TIMEOUT_MS: ${S3_CONNECTION_TIMEOUT_MS:-10000}
      S3_SOCKET_TIMEOUT_MS: ${S3_SOCKET_TIMEOUT_MS:-120000}
      S3_DOWNLOAD_URL_TTL_SECONDS: ${S3_DOWNLOAD_URL_TTL_SECONDS:-3600}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:${PORT:-8888}}
      APP_GIT_SHA: ${APP_GIT_SHA:-}
      SESSION_DRIVER: ${SESSION_DRIVER:-cookie}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_ENABLED: ${MAIL_ENABLED:-true}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Reeva}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-reeva@localhost}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-1gb}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SIGNER_URL: https://signer:8443
      SIGNER_CA_FILE: /app/signer-trust/ca.pem
      SIGNER_REQUESTER_TOKEN_FILE: /app/signer-requester/token
    volumes:
      - reeva_storage:/app/storage
      - reeva_database_credentials:/app/secrets:ro
      - signer_trust:/app/signer-trust:ro
      - signer_requester:/app/signer-requester:ro
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:' + process.env.PORT + '/login').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  database-init:
    image: ${COMPOSE_PROJECT_NAME:-reeva}-app
    pull_policy: never
    entrypoint: ['node', '/app/scripts/init_database_secret.mjs']
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_USER: ${POSTGRES_USER:-reeva}
      POSTGRES_DB: ${POSTGRES_DB:-reeva}
    volumes:
      - reeva_database_credentials:/app/secrets
      - reeva_postgres_admin:/app/admin-secrets
    restart: 'no'

  postgres:
    image: postgres:17-alpine
    depends_on:
      database-init:
        condition: service_completed_successfully
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${POSTGRES_DB:-reeva}
      POSTGRES_PASSWORD_FILE: /run/reeva-admin/postgres_password
      REEVA_DB_USER: ${POSTGRES_USER:-reeva}
    volumes:
      - reeva_postgres:/var/lib/postgresql/data
      - reeva_database_credentials:/run/reeva-secrets:ro
      - reeva_postgres_admin:/run/reeva-admin:ro
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-reeva.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  signer-secrets:
    image: ${COMPOSE_PROJECT_NAME:-reeva}-signer-admin
    build:
      context: .
      dockerfile: signer/docker/Admin.Dockerfile
    user: '0'
    entrypoint: ['sh', '/tools/init-secrets.sh']
    volumes:
      - signer_authority:/authority
      - signer_tls:/signer-tls
      - bao_tls:/bao-tls
      - signer_trust:/trust
      - signer_auth:/auth
      - signer_requester:/requester
      - signer_approver:/approver
      - signer_db_secret:/db-secret
      - signer_db_admin:/db-admin
      - signer_operator:/operator
      - bao_client:/bao-client
      - signer_artifacts:/artifacts
    restart: 'no'

  signer:
    image: ${COMPOSE_PROJECT_NAME:-reeva}-signer
    build:
      context: ./signer
    depends_on:
      signer-secrets:
        condition: service_completed_successfully
      signer-postgres:
        condition: service_healthy
    networks: [default, custody]
    volumes:
      - signer_tls:/tls:ro
      - signer_trust:/trust:ro
      - signer_auth:/auth:ro
      - signer_db_secret:/db-secret:ro
      - bao_client:/bao-client:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    restart: unless-stopped
    stop_grace_period: 25s
    healthcheck:
      # Liveness permits the app to start while the operator initializes/unseals
      # custody. /ready is stricter and fails closed until custody is usable.
      test: ['CMD', 'curl', '--fail', '--silent', '--cacert', '/trust/ca.pem', 'https://localhost:8443/health']
      interval: 10s
      timeout: 5s
      retries: 6

  signer-postgres:
    image: postgres:17-alpine
    depends_on:
      signer-secrets:
        condition: service_completed_successfully
    networks: [custody]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: signer
      POSTGRES_PASSWORD_FILE: /run/signer-admin/password
    volumes:
      - signer_postgres:/var/lib/postgresql/data
      - signer_db_secret:/run/signer-db:ro
      - signer_db_admin:/run/signer-admin:ro
      - ./signer/docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-signer.sh:ro
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d signer']
      interval: 5s
      timeout: 5s
      retries: 12

  openbao:
    image: openbao/openbao:2.7.0
    depends_on:
      signer-secrets:
        condition: service_completed_successfully
    command: ['server']
    networks: [custody]
    environment:
      BAO_ADDR: https://localhost:8200
      BAO_CACERT: /trust/ca.pem
    volumes:
      - bao_data:/openbao/file
      - bao_tls:/bao-tls:ro
      - signer_trust:/trust:ro
      - ./signer/docker/openbao.hcl:/openbao/config/reeva.hcl:ro
    restart: unless-stopped
    healthcheck:
      # Sealed/uninitialized is a valid operator-managed state, not a crash.
      test: ['CMD-SHELL', 'bao status >/dev/null 2>&1; status=$$?; [ "$$status" -eq 0 ] || [ "$$status" -eq 2 ]']
      interval: 10s
      timeout: 5s
      retries: 6

  signer-admin:
    image: ${COMPOSE_PROJECT_NAME:-reeva}-signer-admin
    build:
      context: .
      dockerfile: signer/docker/Admin.Dockerfile
    profiles: [tools]
    networks: [default, custody]
    volumes:
      - signer_trust:/trust:ro
      - signer_approver:/approver:ro
      - signer_artifacts:/artifacts
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

  signer-operator:
    image: ${COMPOSE_PROJECT_NAME:-reeva}-signer-admin
    build:
      context: .
      dockerfile: signer/docker/Admin.Dockerfile
    profiles: [tools]
    networks: [custody]
    volumes:
      - signer_trust:/trust:ro
      - signer_operator:/operator
      - bao_client:/bao-client
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']

networks:
  custody:
    internal: true

volumes:
  reeva_storage:
  reeva_postgres:
  reeva_database_credentials:
  reeva_postgres_admin:
  signer_authority:
  signer_tls:
  bao_tls:
  signer_trust:
  signer_auth:
  signer_requester:
  signer_approver:
  signer_db_secret:
  signer_db_admin:
  signer_postgres:
  signer_operator:
  bao_client:
  bao_data:
  signer_artifacts:
